bit_widths:
  # PAPER FACT 3.1.1: "the first and last convolution weights were INT8 ...
  # all the remaining weights and activations were quantized as INT4"
  first_conv_weight_bits: 8         # PAPER FACT  (Table 6 "8b-8b")
  last_conv_weight_bits: 8          # PAPER FACT  (Table 6 "4b-8b")
  hidden_weight_bits: 4             # PAPER FACT
  hidden_act_bits: 4                # PAPER FACT
  input_act_bits: 8                 # A14 - matches REPOSITORY FACT idt=UINT8
  # DERIVED FACT (spec P11): odt=INT8 and dequant scale 1/127 force 8 bits here.
  # A 4-bit output would require a scale of 1/7.
  output_act_bits: 8

quantisers:
  weight_scaling_per_output_channel: false   # A10 - per-tensor
  weight_scaling_impl: parameter_from_stats  # A11 - learned float scale
  weight_narrow_range: true                  # A11
  act_relu_signed: false                     # A12 - unsigned after ReLU
  act_hardtanh_signed: true                  # A12 - signed after HardTanh
  act_hardtanh_scaling: const_1_over_127      # DERIVED (spec P11) - constant, narrow range,
                                             # so scale.npy == 1/127 holds by construction
  float_to_int_impl: round                   # A13 - round-half-even (Brevitas default)
  bias_quant: null                           # A16 - no bias / absorbed into thresholds

structure:
  batchnorm: true                   # A15 - HIGHEST-RISK ASSUMPTION (flipped 2026-10-16).
    # Table 1 lists no BN, yet the paper's abbreviation list defines "BN" and
    # stock YOLOv3-Tiny has BN after every conv. FINN absorbs BN into
    # MultiThreshold during streamlining, so the HARDWARE is unaffected either
    # way - but training dynamics and final accuracy are not.
    # Without BN the final conv's output sits below the constant 1/127 step of
    # QuantHardTanh, so the network outputs exactly 0 and never trains
    # (DECISIONS.md, 2026-10-16). `train.py --no-batchnorm` is now the ablation.
  qat_from_scratch: true            # A17 - consistent with PAPER FACT 3.1.4 "low-scratch"

input_normalisation:
  # PAPER FACT 3.4.1: a Div node is inserted before conv 1 so the UINT8 input is
  # normalised on-chip. The literal divisor is A3.
  divisor: 255                      # A3

export:
  api: export_qonnx                 # A18
  onnx_opset: 13                    # A19 - fixed here so it is recorded, not floating
  detach_detect_head: true          # PAPER FACT 3.2
